</style></head><body><main>

<button id="go">Reconcile</button><button id="clr" class="t">Clear all files</button><button id="ex" disabled>Download Excel report</button><button id="csv" disabled>Download this tab (CSV)</button><button id="pr" class="t" disabled>Print / save as PDF</button>

<div class="card"><div id="tabs"></div>
<label style="margin:6px 0"><input id="q" placeholder="Search this tab: invoice no., amount, VIN, narration…"></label>
<div id="view"></div></div></section>

'Only in Tally':{h:['Ledger sheet','Date','Particulars','Voucher type','Voucher no.','Narration','Amount','Note'],r:oT.map(t=>[t.sheet,d2s(t.date),t.part,t.vtype,t.vno,t.narr,t.amt,'Not on BMW statement: check period, ledger or posting'])},
'Group matches':{h:['Key','BMW lines','BMW net','Tally lines','Tally net','Difference','Types'],r:G.map(g=>[g.k,String(g.bs.length),g.nb,String(g.ts.length),g.nt,r2(g.nb-g.nt),[...new Set(g.bs.map(b=>b.typ))].join(', ')])},
'By reference':{h:['Reference','BMW lines','BMW net','Tally lines','Tally net','Difference','Status'],r:RF},
'Open items':{h:['Doc no.','Reference','Type','Posting date','Age (days)','Amount','Age bucket'],r:OP},
'Duplicates':{h:['Source','Date','Reference / voucher','Amount','Count'],r:DU},
'By type':{h:['Type','Lines','Total amount','Unmatched lines','Unmatched amount'],r:Object.keys(ty).sort().map(k=>[k,String(ty[k].n),r2(ty[k].t),String(ty[k].u),r2(ty[k].ut)])},
'By month':{h:['Month','BMW net','Tally net','Difference','BMW lines unmatched'],r:Object.keys(mo).sort().map(k=>[k,r2(mo[k].b),r2(mo[k].t),r2(mo[k].b-mo[k].t),String(mo[k].u)])}}};
$('out').hidden=false;$('ex').disabled=$('csv').disabled=$('pr').disabled=false;tab='Summary';msg(`Done: ${M.length} pairs matched, ${oB.length} only in BMW, ${oT.length} only in Tally.`);draw()}
function tbl(h,r,q){q=q.toLowerCase();let rows=q?r.filter(x=>x.join(' ').toLowerCase().includes(q)):r;if(SO.t===tab&&SO.c!=null){const nv=v=>typeof v==='number'?v:/^-?\d+(\.\d+)?$/.test(v)?+v:null;rows=[...rows].sort((a,b)=>{const x=nv(a[SO.c]),y=nv(b[SO.c]);return SO.d*(x!=null&&y!=null?x-y:String(a[SO.c]).localeCompare(String(b[SO.c])))})}
return`<div class="sc"><table><thead><tr>${h.map((x,i)=>`<th data-c="${i}" style="cursor:pointer">${esc(x)}${SO.t===tab&&SO.c===i?(SO.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr${x[1]===''&&h[1]==='Amount / count'?' class="s"':''}>${x.map(c=>typeof c==='number'?`<td class="n">${fmt(c)}</td>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="mut">${rows.length} of ${r.length} rows</p>`}
function draw(){const names=['Summary',...Object.keys(R.sets)];
$('tabs').innerHTML=names.map(n=>`<button class="t${n===tab?' on':''}" data-n="${n}">${n}${n==='Summary'?'':' ('+R.sets[n].r.length+')'}</button>`).join('');
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.n;draw()});
const q=$('q').value;$('view').innerHTML=tab==='Summary'?`<div class="ban">Closing difference: <b>${fmt(R.diff)}</b>. Unexplained: <b class="${Math.abs(R.un)<0.01?'ok':'bad'}">${fmt(R.un)}</b></div>`+tbl(['Item','Amount / count'],R.sum,q):tbl(R.sets[tab].h,R.sets[tab].r,q);$('view').querySelectorAll('th').forEach(th=>th.onclick=()=>{const c=+th.dataset.c;SO={t:tab,c,d:SO.t===tab&&SO.c===c?-SO.d:1};draw()})}
$('csv').onclick=()=>{const t=tab==='Summary'?{h:['Item','Amount / count'],r:R.sum}:R.sets[tab],c=v=>'"'+String(v).replace(/"/g,'""')+'"',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[t.h,...t.r].map(r=>r.map(c).join(',')).join('\n')],{type:'text/csv'}));a.download=tab.replace(/\W+/g,'_')+'.csv';a.click()};
$('pr').onclick=()=>window.print();
$('q').oninput=()=>R&&draw();$('go').onclick=run;
$('ex').onclick=()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Item','Amount / count'],...R.sum]),'Summary');
for(const k in R.sets)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([R.sets[k].h,...R.sets[k].r]),k);XLSX.writeFile(wb,'BMW_vs_Tally_Reconciliation.xlsx')};
