<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Deep Architectural Slate Squircle Backdrop -->
    <linearGradient id="vcpl-fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F3E4E" />
      <stop offset="55%" stop-color="#222E3B" />
      <stop offset="100%" stop-color="#141C26" />
    </linearGradient>

    <!-- Warm Marigold Gold Gradient -->
    <linearGradient id="vcpl-fav-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F9C80E" />
    </linearGradient>

    <!-- Warm Paper Cream Gradient -->
    <linearGradient id="vcpl-fav-cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="100%" stop-color="#F6E9C3" />
    </linearGradient>

    <!-- Subtle Ambient Glow Behind Gears -->
    <radialGradient id="vcpl-fav-glow" cx="50%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#F9C80E" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#CEE5DC" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#141C26" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Top Glass Highlight -->
    <linearGradient id="vcpl-fav-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#FFFDF5" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#F9C80E" stop-opacity="0.18" />
    </linearGradient>

    <!-- Clip Path for 4-Cell VCPL Keycap -->
    <clipPath id="vcpl-fav-bar">
      <rect x="7" y="10" width="48" height="20" rx="5.5" />
    </clipPath>
  </defs>

  <!-- Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#vcpl-fav-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#vcpl-fav-glow)" />

  <!-- Subtle Inner Specular Rim & Crisp Marigold Border -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#vcpl-fav-rim)" stroke-width="1.2" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#F9C80E" stroke-width="2.2" />

  <!-- Tactile Hard-Offset Marigold Shadow Behind VCPL Keycap -->
  <rect x="9.5" y="12.5" width="48" height="20" rx="5.5" fill="#F9C80E" stroke="#141C26" stroke-width="1" />

  <!-- Unified 4-Cell VCPL Keycap Bar -->
  <g clip-path="url(#vcpl-fav-bar)">
    <rect x="7" y="10" width="48" height="20" fill="url(#vcpl-fav-cream)" />
    <rect x="7" y="10" width="12" height="20" fill="url(#vcpl-fav-gold)" />

    <!-- Fine Vertical Cell Dividers -->
    <line x1="19" y1="10" x2="19" y2="30" stroke="#1E293B" stroke-opacity="0.22" stroke-width="1" />
    <line x1="31" y1="10" x2="31" y2="30" stroke="#1E293B" stroke-opacity="0.18" stroke-width="1" />
    <line x1="43" y1="10" x2="43" y2="30" stroke="#1E293B" stroke-opacity="0.18" stroke-width="1" />

    <!-- Crisp Geometric Letters -->
    <text x="13" y="24.2" text-anchor="middle" fill="#18222C" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="12.5">V</text>
    <text x="25" y="24.2" text-anchor="middle" fill="#1E293B" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="12.5">C</text>
    <text x="37" y="24.2" text-anchor="middle" fill="#1E293B" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="12.5">P</text>
    <text x="49" y="24.2" text-anchor="middle" fill="#1E293B" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="12.5">L</text>
  </g>

  <!-- Crisp Outer Keycap Frame -->
  <rect x="7" y="10" width="48" height="20" rx="5.5" fill="none" stroke="#141C26" stroke-width="1.4" />

  <!-- Twin Interlocking Precision 'OO' Tool Rings (Matching TOOLS Wordmark) -->
  <!-- Left Precision Ring (Warm Cream + 45 deg cut) -->
  <g>
    <circle cx="22.5" cy="45" r="7" fill="none" stroke="#FFFDF5" stroke-width="4.2" />
    <line x1="16.8" y1="50.7" x2="28.2" y2="39.3" stroke="#1B2531" stroke-width="2.1" stroke-linecap="butt" />
  </g>

  <!-- Right Precision Ring (Mint Emerald + -45 deg cut + Gold Index Core) -->
  <g>
    <circle cx="40.5" cy="45" r="7" fill="none" stroke="#CEE5DC" stroke-width="4.2" />
    <line x1="34.8" y1="39.3" x2="46.2" y2="50.7" stroke="#1B2531" stroke-width="2.1" stroke-linecap="butt" />
    <circle cx="40.5" cy="45" r="2.2" fill="#F9C80E" />
  </g>

  <!-- Signature Modern Corner Dots -->
  <circle cx="52.5" cy="52" r="2.4" fill="#F9C80E" stroke="#141C26" stroke-width="0.9" />
  <circle cx="57" cy="48.5" r="1.3" fill="#CEE5DC" />
</svg>
