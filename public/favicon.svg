<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="vcpl-fav-grid">
      <rect x="8" y="8" width="48" height="48" rx="10" />
    </clipPath>
  </defs>

  <!-- Theme Slate Ink Rounded Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#2F3E4E" stroke="#F9C80E" stroke-width="2.5" />

  <!-- Box-Structured 2x2 Grid Containing All 4 Letters V C P L Inside -->
  <g clip-path="url(#vcpl-fav-grid)">
    <!-- Top-Left V (Marigold Highlight) -->
    <rect x="8" y="8" width="24" height="24" fill="#F9C80E" />
    <!-- Top-Right C (Deep Slate) -->
    <rect x="32" y="8" width="24" height="24" fill="#2F3E4E" />
    <!-- Bottom-Left P (Deep Slate) -->
    <rect x="8" y="32" width="24" height="24" fill="#2F3E4E" />
    <!-- Bottom-Right L (Mint Highlight) -->
    <rect x="32" y="32" width="24" height="24" fill="#CEE5DC" />

    <!-- Crisp Grid Dividers -->
    <line x1="32" y1="8" x2="32" y2="56" stroke="#FFFDF5" stroke-opacity="0.45" stroke-width="1.6" />
    <line x1="8" y1="32" x2="56" y2="32" stroke="#FFFDF5" stroke-opacity="0.45" stroke-width="1.6" />

    <!-- Bold Geometric Letters -->
    <text x="20" y="26.5" text-anchor="middle" fill="#2F3E4E" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">V</text>
    <text x="44" y="26.5" text-anchor="middle" fill="#FFFDF5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">C</text>
    <text x="20" y="50.5" text-anchor="middle" fill="#FFFDF5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">P</text>
    <text x="44" y="50.5" text-anchor="middle" fill="#2F3E4E" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">L</text>
  </g>

  <!-- Crisp Outer Box Stroke -->
  <rect x="8" y="8" width="48" height="48" rx="10" fill="none" stroke="#FFFDF5" stroke-width="1.8" />
</svg>
