  <rect x="108" y="394" width="228" height="54" rx="14" fill="#FEF2C8" stroke="#2F3E4E" stroke-width="2" />
  <text x="222" y="428" text-anchor="middle" fill="#2F3E4E" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20">Bank Slips &amp; GST</text>

  <rect x="352" y="394" width="228" height="54" rx="14" fill="#CEE5DC" stroke="#2F3E4E" stroke-width="2" />
  <text x="466" y="428" text-anchor="middle" fill="#2F3E4E" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20">70 PDF Utilities</text>

  <rect x="596" y="394" width="228" height="54" rx="14" fill="#FFE1B3" stroke="#2F3E4E" stroke-width="2" />
