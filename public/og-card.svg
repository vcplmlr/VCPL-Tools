<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="bg-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#2F3E4E" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Buttercream Canvas -->
  <rect width="1200" height="630" fill="#FEF2C8" />
  <rect width="1200" height="630" fill="url(#bg-dots)" />

  <!-- Top Dark Slate Strip -->
  <rect x="0" y="0" width="1200" height="16" fill="#2F3E4E" />
  <rect x="0" y="16" width="1200" height="6" fill="#F9C80E" />

  <!-- Main Card Container -->
  <rect x="64" y="64" width="1072" height="502" rx="28" fill="#FFFDF5" stroke="#2F3E4E" stroke-width="4" />
  <rect x="72" y="72" width="1072" height="502" rx="28" fill="none" />

  <!-- Top Badge Row -->
  <rect x="108" y="108" width="212" height="44" rx="12" fill="#2F3E4E" />
  <rect x="120" y="118" width="12" height="12" rx="2" fill="#F9C80E" />
  <rect x="134" y="118" width="12" height="12" rx="2" fill="#CEE5DC" />
  <rect x="120" y="132" width="12" height="12" rx="2" fill="#CEE5DC" />
