  <rect x="336" y="108" width="268" height="44" rx="12" fill="#CEE5DC" stroke="#2F3E4E" stroke-width="2" />
  <text x="470" y="136" text-anchor="middle" fill="#2F3E4E" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18">190+ OFFLINE TOOLS</text>

  <rect x="620" y="108" width="230" height="44" rx="12" fill="#F9C80E" stroke="#2F3E4E" stroke-width="2" />
  <text x="735" y="136" text-anchor="middle" fill="#2F3E4E" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18">100% ZERO UPLOAD</text>

  <!-- Headline -->
  <text x="108" y="232" fill="#2F3E4E" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" letter-spacing="-1">Smart Browser Utilities for</text>
  <text x="108" y="298" fill="#2F3E4E" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" letter-spacing="-1">Banking, GST, PDF &amp; Finance</text>

  <!-- Subtitle -->
  <text x="108" y="352" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24">SBI &amp; HDFC Deposit Slips · Form 26AS &amp; GSTR-2B · PDF to Excel · Image Studio · Calculator Hub</text>

